<!--
SATURN — thermal design

This file is a single cinematic view of Saturn meant to stay cool.
Nothing here is a full-screen image pass, and nothing uploads a texture after startup.

- Context: WebGL2 when the browser has it, otherwise WebGL1 on the same canvas.
  three.js r152.2 is the last line that still contains a WebGL1 renderer.
  The context is created once with antialiasing off, stencil off, and
  powerPreference "low-power". Antialiasing stays off on Medium and High too,
  because turning it on would mean a second context.
- Draw list: one unlit starfield, one Lambert-or-better planet, one ring,
  five Lambert moons, five orbit lines, one additive sprite for the limb.
  One directional light. No shadow maps. No second light. The faint night side
  is a constant in the planet shader, and a small emissive term on the moons.
- Stars: one round sprite painted once, on a single unlit points cloud parented
  to the camera. Pixel-sized, no per-star lights, no depth writes.
- Saturn: one 512×512 canvas of latitude bands, painted once. The mesh only spins.
- Rings: one annulus from the D ring through the F ring. A 512×1 texture holds
  the radial color and opacity (C, B, the Cassini Division, A, the Encke Gap, F)
  and is sampled by radius. Planet-on-ring and ring-on-planet darkening are
  analytic tests against a fixed sun direction, not shadow maps.
- Motion cap: frames are scheduled from a single loop. A time accumulator
  drops any callback that arrives before the quality step.
  Low (the default) is 24 fps at pixel ratio 1.
  Medium is 30 fps at pixel ratio min(device, 1.5).
  High is 60 fps at that same pixel-ratio ceiling.
- Hidden tabs stop the loop (visibilitychange / document.hidden) and cancel the
  pending callback, so the GPU goes idle. An IntersectionObserver does the same
  when the canvas leaves the viewport.
- Audio: off until the HUD control or the S key. One context, three oscillators,
  two slow LFOs, one lowpass. Master gain stays at or below 0.12 and ramps.
  Mute and a hidden tab fade it out, then suspend the context. No reverb,
  no analyser, and the frame loop never touches the graph.
- Moon distances and periods are real ratios (Saturn equatorial radius = 1).
  Drawn moon radii are square-root scaled so Titan stays the largest and the
  small moons stay clickable. Orbit speeds use one shared clock, so the
  relative periods stay true. The cloud deck spins slower than that clock
  on purpose, so the bands read as weather rather than a blur.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saturn</title>
<style>
  :root {
    color-scheme: dark;
    --cyan: #9ee4de;
    --cyan-dim: rgba(158, 228, 222, 0.62);
    --amber: #e2b15c;
    --line: rgba(158, 228, 222, 0.32);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #c {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: grab;
  }
  #c.drag { cursor: grabbing; }
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--cyan);
    letter-spacing: 0.08em;
    user-select: none;
  }
  .top {
    position: absolute;
    top: 18px;
    left: 22px;
    right: 22px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12px;
  }
  .title {
    color: var(--amber);
    letter-spacing: 0.32em;
    font-size: 13px;
  }
  #fps, #mode, #focus-name, #pause-flag {
    font-variant-numeric: tabular-nums;
  }
  #pause-flag, #focus-name { color: var(--amber); }
  .modes {
    margin-left: auto;
    display: flex;
    gap: 6px;
    pointer-events: auto;
  }
  .modes button {
    background: transparent;
    color: var(--cyan-dim);
    border: 1px solid var(--line);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.16em;
    padding: 4px 8px;
    cursor: pointer;
  }
  .modes button.on {
    color: var(--amber);
    border-color: rgba(226, 177, 92, 0.85);
  }
  .modes button:focus-visible {
    outline: 1px solid var(--cyan);
    outline-offset: 2px;
  }
  .legend {
    position: absolute;
    top: 46px;
    left: 22px;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--cyan-dim);
  }
  .hint {
    position: absolute;
    left: 22px;
    right: 22px;
    bottom: 16px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--cyan-dim);
    line-height: 1.6;
  }
  #gl-badge { color: rgba(158, 228, 222, 0.4); }
  #labels { position: absolute; inset: 0; overflow: hidden; }
  .lbl {
    position: absolute;
    left: 0;
    top: 0;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--cyan);
    text-shadow: 0 1px 2px #000;
    white-space: nowrap;
  }
  .lbl.hot { color: var(--amber); }
  body.ui-off #hud { display: none; }
  #err {
    position: fixed;
    left: 22px;
    bottom: 22px;
    max-width: 36rem;
    color: var(--amber);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    line-height: 1.5;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="top">
    <span class="title">SATURN</span>
    <span id="fps">00 FPS</span>
    <span id="mode">LOW</span>
    <span id="pause-flag" hidden>PAUSED</span>
    <span id="focus-name"></span>
    <div class="modes">
      <button type="button" id="sound-btn" aria-pressed="false">Sound: Off</button>
      <button type="button" data-q="low" class="on">LOW</button>
      <button type="button" data-q="medium">MED</button>
      <button type="button" data-q="high">HIGH</button>
    </div>
  </div>
  <div class="legend">RINGS · D · C · B · CASSINI · A · F</div>
  <div id="labels"></div>
  <div class="hint">
    <span>DRAG ORBIT · WHEEL ZOOM · DBL-CLICK MOON · 1–5 FOCUS · 0 RELEASE · H UI · SPACE PAUSE · S SOUND</span>
    <span id="gl-badge">GL</span>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var fpsEl = document.getElementById('fps');
  var modeEl = document.getElementById('mode');
  var pauseEl = document.getElementById('pause-flag');
  var focusEl = document.getElementById('focus-name');
  var glBadge = document.getElementById('gl-badge');
  var soundBtn = document.getElementById('sound-btn');
  var labelsRoot = document.getElementById('labels');

  function fail(msg) {
    var p = document.createElement('p');
    p.id = 'err';
    p.textContent = msg;
    document.body.appendChild(p);
  }

  if (!window.THREE) {
    fail('Three.js did not load, so the scene cannot start.');
    return;
  }

  var REQ = 60268;
  var DAY_SEC = 18;
  var OBLATENESS = 0.902;
  var RING_IN_KM = 66900;
  var RING_OUT_KM = 140600;
  var RING_IN = RING_IN_KM / REQ;
  var RING_OUT = RING_OUT_KM / REQ;

  var QUALITY = {
    low: { fps: 24, pr: 1, label: 'LOW' },
    medium: { fps: 30, pr: 1.5, label: 'MED' },
    high: { fps: 60, pr: 1.5, label: 'HIGH' }
  };

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function smoothstep(e0, e1, x) {
    var t = clamp01((x - e0) / (e1 - e0));
    return t * t * (3 - 2 * t);
  }
  function mix(a, b, t) { return a + (b - a) * t; }
  function mix3(a, b, t) {
    return [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];
  }
  function clamp8(v) {
    if (v < 0) return 0;
    if (v > 255) return 255;
    return v | 0;
  }
  function hash01(i) {
    var x = (i | 0) * 374761393;
    x = (x ^ (x >>> 13)) * 1274126177;
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }

  function sampleRing(km, i) {
    var rgb = [150, 136, 114];
    var a = 0;
    if (km < 74510) {
      var td = clamp01((km - RING_IN_KM) / (74510 - RING_IN_KM));
      a = 0.045 + td * 0.07;
      rgb = [154, 140, 118];
    } else if (km < 92000) {
      var tc = clamp01((km - 74658) / (92000 - 74658));
      a = 0.16 + tc * 0.16;
      rgb = [176, 162, 140];
      if (Math.abs(km - 87500) < 260) a = 0.02;
    } else if (km < 117580) {
      var rip = 0.93 + 0.07 * Math.sin(km * 0.018);
      a = 0.9;
      rgb = [232 * rip, 222 * rip, 204 * rip];
    } else if (km < 122170) {
      a = 0;
      rgb = [110, 100, 88];
      if (Math.abs(km - 117820) < 160) {
        a = 0.28;
        rgb = [210, 198, 176];
      }
    } else if (km < 136775) {
      var ta = clamp01((km - 122170) / (136775 - 122170));
      a = 0.68 - ta * 0.12;
      rgb = [214, 204, 186];
      if (Math.abs(km - 133590) < 230) a = 0;
      if (Math.abs(km - 136505) < 70) a = 0.04;
    } else if (km < 139900) {
      a = 0;
    } else if (km < 140480) {
      var df = Math.abs(km - 140180) / 150;
      a = df < 1 ? (1 - df) * 0.8 : 0;
      rgb = [236, 230, 214];
    }
    var g = (hash01(i) - 0.5) * 10;
    return [clamp8(rgb[0] + g), clamp8(rgb[1] + g), clamp8(rgb[2] + g), clamp8(a * 255)];
  }

  function makeRingTexture() {
    var W = 512;
    var data = new Uint8Array(W * 4);
    for (var i = 0; i < W; i++) {
      var km = RING_IN_KM + ((i + 0.5) / W) * (RING_OUT_KM - RING_IN_KM);
      var px = sampleRing(km, i);
      data[i * 4] = px[0];
      data[i * 4 + 1] = px[1];
      data[i * 4 + 2] = px[2];
      data[i * 4 + 3] = px[3];
    }
    var tex = new THREE.DataTexture(data, W, 1, THREE.RGBAFormat, THREE.UnsignedByteType);
    tex.flipY = false;
    tex.needsUpdate = true;
    tex.generateMipmaps = false;
    tex.magFilter = THREE.LinearFilter;
    tex.minFilter = THREE.LinearFilter;
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.unpackAlignment = 1;
    tex.colorSpace = THREE.LinearSRGBColorSpace;
    return tex;
  }

  function makeBands() {
    var w = 512;
    var h = 512;
    var c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    var ctx = c.getContext('2d');
    var img = ctx.createImageData(w, h);
    var d = img.data;
    var cream = [228, 210, 176];
    var gold = [206, 164, 104];
    var ochre = [158, 108, 62];
    var pale = [236, 224, 198];
    var pole = [188, 178, 160];
    var storms = [
      { u: 0.22, v: 0.42, rx: 0.035, ry: 0.014, k: -22 },
      { u: 0.58, v: 0.61, rx: 0.05, ry: 0.012, k: -16 },
      { u: 0.74, v: 0.36, rx: 0.018, ry: 0.016, k: 14 }
    ];
    for (var y = 0; y < h; y++) {
      var north = 1 - y / (h - 1);
      var lat = (north - 0.5) * Math.PI;
      var absL = Math.abs(lat);
      var belts = Math.sin(lat * 9.2) * 0.5 + Math.sin(lat * 3.1 + 0.4) * 0.35;
      var base = mix3(cream, gold, clamp01(belts * 0.5 + 0.5));
      base = mix3(base, ochre, smoothstep(0.2, 0.85, Math.abs(Math.sin(lat * 7.0))));
      var eq = Math.exp(-lat * lat * 26);
      base = mix3(base, pale, eq * 0.6);
      var belt = Math.exp(-Math.pow((absL - 0.55) * 6.2, 2));
      base = mix3(base, ochre, belt * 0.5);
      var polar = smoothstep(1.05, 1.42, absL);
      base = mix3(base, pole, polar);
      for (var x = 0; x < w; x++) {
        var u = x / w;
        var nx = Math.cos(u * Math.PI * 2);
        var ny = Math.sin(u * Math.PI * 2);
        var n = hash01((nx * 180 + ny * 180 + y * 2) | 0);
        var r = base[0] + (n - 0.5) * 12;
        var gch = base[1] + (n - 0.5) * 10;
        var b = base[2] + (n - 0.5) * 8;
        var s;
        for (s = 0; s < storms.length; s++) {
          var st = storms[s];
          var du = (u - st.u) / st.rx;
          var dv = (north - st.v) / st.ry;
          var e = Math.exp(-(du * du + dv * dv));
          r += st.k * e;
          gch += st.k * 0.85 * e;
          b += st.k * 0.45 * e;
        }
        if (north > 0.9) {
          var hex = 0.5 + 0.5 * Math.cos(6 * u * Math.PI * 2);
          var hk = (north - 0.9) / 0.1;
          var m = 1 - 0.09 * hk * (1 - hex);
          r *= m;
          gch *= m;
          b *= m;
        }
        var o = (y * w + x) * 4;
        d[o] = clamp8(r);
        d[o + 1] = clamp8(gch);
        d[o + 2] = clamp8(b);
        d[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    var tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.LinearSRGBColorSpace;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.anisotropy = 1;
    tex.needsUpdate = true;
    return tex;
  }

  function makeStarSprite() {
    var c = document.createElement('canvas');
    c.width = 32;
    c.height = 32;
    var g = c.getContext('2d');
    var grd = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.4, 'rgba(255,255,255,0.55)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, 32, 32);
    var tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.LinearSRGBColorSpace;
    tex.needsUpdate = true;
    return tex;
  }

  function makeStarfield() {
    var count = 900;
    var positions = new Float32Array(count * 3);
    var colors = new Float32Array(count * 3);
    var seed = 12345;
    function rnd() {
      seed = (seed * 16807) % 2147483647;
      return seed / 2147483647;
    }
    var i;
    for (i = 0; i < count; i++) {
      var z = rnd() * 2 - 1;
      var t = rnd() * Math.PI * 2;
      var rxy = Math.sqrt(Math.max(0, 1 - z * z));
      var rad = 420;
      positions[i * 3] = rad * rxy * Math.cos(t);
      positions[i * 3 + 1] = rad * z;
      positions[i * 3 + 2] = rad * rxy * Math.sin(t);
      var bright = 0.4 + rnd() * 0.6;
      var tint = rnd();
      var rr = bright;
      var gg = bright;
      var bb = bright;
      if (tint > 0.94) {
        gg = bright * 0.8;
        bb = bright * 0.5;
      } else if (tint > 0.88) {
        rr = bright * 0.72;
        bb = bright * 0.95;
      }
      colors[i * 3] = rr;
      colors[i * 3 + 1] = gg;
      colors[i * 3 + 2] = bb;
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    var mat = new THREE.PointsMaterial({
      map: makeStarSprite(),
      size: 1.7,
      sizeAttenuation: false,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      vertexColors: true,
      blending: THREE.AdditiveBlending
    });
    var points = new THREE.Points(geo, mat);
    points.frustumCulled = false;
    points.renderOrder = -2;
    return points;
  }

  function makeDisc() {
    var c = document.createElement('canvas');
    c.width = 128;
    c.height = 128;
    var g = c.getContext('2d');
    var grd = g.createRadialGradient(64, 64, 10, 64, 64, 64);
    grd.addColorStop(0, 'rgba(0, 0, 0, 0)');
    grd.addColorStop(0.42, 'rgba(0, 0, 0, 0)');
    grd.addColorStop(0.52, 'rgba(236, 214, 170, 0.28)');
    grd.addColorStop(0.68, 'rgba(120, 160, 170, 0.05)');
    grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, 128, 128);
    var tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.LinearSRGBColorSpace;
    tex.needsUpdate = true;
    return tex;
  }

  function makeMoonCanvas(painter, w, h) {
    var c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    var ctx = c.getContext('2d');
    var img = ctx.createImageData(w, h);
    painter(img.data, w, h);
    ctx.putImageData(img, 0, 0);
    var tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.LinearSRGBColorSpace;
    tex.needsUpdate = true;
    return tex;
  }

  function paintTitan(d, w, h) {
    var y, x;
    for (y = 0; y < h; y++) {
      var lat = (y / (h - 1) - 0.5) * Math.PI;
      var band = Math.sin(lat * 6);
      var hood = smoothstep(1.05, 1.4, Math.abs(lat));
      for (x = 0; x < w; x++) {
        var n = hash01(x * 13 + y * 47);
        var r = 186 + band * 22 - hood * 30 + (n - 0.5) * 10;
        var g = 104 + band * 12 - hood * 16 + (n - 0.5) * 8;
        var b = 42 + band * 4 - hood * 8;
        var o = (y * w + x) * 4;
        d[o] = clamp8(r);
        d[o + 1] = clamp8(g);
        d[o + 2] = clamp8(b);
        d[o + 3] = 255;
      }
    }
  }

  function paintIapetus(d, w, h) {
    var y, x;
    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) {
        var u = x / (w - 1);
        var k = smoothstep(0.42, 0.58, u);
        var n = hash01(x * 17 + y * 31);
        var dark = [46, 38, 32];
        var ice = [206, 198, 186];
        var col = mix3(dark, ice, k);
        var o = (y * w + x) * 4;
        d[o] = clamp8(col[0] + (n - 0.5) * 12);
        d[o + 1] = clamp8(col[1] + (n - 0.5) * 10);
        d[o + 2] = clamp8(col[2] + (n - 0.5) * 8);
        d[o + 3] = 255;
      }
    }
  }

  var attrs = {
    alpha: false,
    antialias: false,
    depth: true,
    stencil: false,
    powerPreference: 'low-power',
    preserveDrawingBuffer: false,
    failIfMajorPerformanceCaveat: false
  };
  var gl = canvas.getContext('webgl2', attrs);
  var isGL2 = !!gl;
  if (!gl) {
    gl = canvas.getContext('webgl', attrs) || canvas.getContext('experimental-webgl', attrs);
  }
  if (!gl) {
    fail('WebGL is unavailable in this browser.');
    return;
  }

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      context: gl,
      antialias: false,
      alpha: false,
      premultipliedAlpha: false,
      powerPreference: 'low-power',
      stencil: false
    });
  } catch (err) {
    fail('WebGL renderer failed to start.');
    return;
  }
  renderer.setClearColor(0x000000, 1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.shadowMap.enabled = false;
  renderer.shadowMap.autoUpdate = false;
  glBadge.textContent = isGL2 ? 'GL2' : 'GL1';

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(42, 1, 0.05, 1200);
  scene.add(camera);

  camera.add(makeStarfield());

  // Sun sits ~28° above the ring plane after the 26.7° obliquity, so the rings
  // are lit and the planet casts a readable shadow on them.
  var lightWorld = new THREE.Vector3(0.56, 0.82, -0.13).normalize();
  var sun = new THREE.DirectionalLight(0xfff3df, 1.15);
  sun.position.copy(lightWorld);
  sun.castShadow = false;
  scene.add(sun);
  scene.add(sun.target);

  var system = new THREE.Group();
  system.rotation.z = THREE.MathUtils.degToRad(26.73);
  scene.add(system);
  system.updateMatrixWorld(true);
  var invQuat = system.quaternion.clone().invert();
  var lightLocal = lightWorld.clone().applyQuaternion(invQuat);

  var bandTex = makeBands();
  var ringTex = makeRingTexture();

  var planetVert = [
    'varying vec3 vWorld;',
    'varying vec3 vN;',
    'varying vec2 vUv;',
    'void main() {',
    '  vUv = uv;',
    '  vec3 p = position;',
    '  p.y *= 0.902;',
    '  vec3 n = normalize(vec3(normal.x, normal.y / 0.902, normal.z));',
    '  vec4 world = modelMatrix * vec4(p, 1.0);',
    '  vWorld = world.xyz;',
    '  vN = normalize(mat3(modelMatrix) * n);',
    '  gl_Position = projectionMatrix * viewMatrix * world;',
    '}'
  ].join('\n');

  var qrotFn = [
    'vec3 qrot(vec4 q, vec3 v) {',
    '  vec3 t = 2.0 * cross(q.xyz, v);',
    '  return v + q.w * t + cross(q.xyz, t);',
    '}'
  ].join('\n');

  var planetFrag = [
    'varying vec3 vWorld;',
    'varying vec3 vN;',
    'varying vec2 vUv;',
    'uniform sampler2D uBands;',
    'uniform sampler2D uRing;',
    'uniform vec3 uLightWorld;',
    'uniform vec3 uLightLocal;',
    'uniform vec4 uInvQ;',
    'uniform float uRin;',
    'uniform float uRout;',
    qrotFn,
    'void main() {',
    '  vec3 N = normalize(vN);',
    '  vec3 L = normalize(uLightWorld);',
    '  vec3 Ll = normalize(uLightLocal);',
    '  vec3 local = qrot(uInvQ, vWorld);',
    '  float ndl = max(dot(N, L), 0.0);',
    '  float ringShade = 1.0;',

      }
    }
  });
  if (window.IntersectionObserver) {
    var io = new IntersectionObserver(function (entries) {
      inView = entries.some(function (entry) { return entry.isIntersecting; });
      if (inView) start();
      else halt();
    }, { threshold: 0.01 });
    io.observe(canvas);
  }

  window.addEventListener('resize', resize);
  setQuality('low');
  placeCamera();
  resize();
  start();
})();
</script>
</body>
